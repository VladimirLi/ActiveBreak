name: Pages

# Push trigger returns once Pages is enabled and the site is approved for publishing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse to publish placeholders
        run: |
          if grep -n "TODO" docs/index.html; then
            echo "::error file=docs/index.html::Placeholder links remain. Replace or delete them before publishing."
            exit 1
          fi

      - name: Stage site files
        run: |
          mkdir -p _site/brand
          cp docs/index.html docs/site.css _site/
          cp -R docs/brand/favicon docs/brand/screenshots _site/brand/
          cp docs/brand/social-preview.png _site/brand/
          touch _site/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
