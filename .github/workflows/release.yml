name: Release

on:
  push:
    tags: ['v*']
    branches: ['ci/unsigned-release-pipeline']
  workflow_dispatch:
    inputs:
      version:
        description: Version for the build artifacts (no release is created)
        default: 0.0.0-dev

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and package
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '0.0.0-dev' }}
          ARCHS: arm64 x86_64
        run: |
          swift --version
          ./scripts/package-release.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Publish GitHub Release
        run: |
          {
            echo '## Install'
            echo
            echo 'Download the `.dmg`, drag the app to Applications, then follow the first-launch steps in the [README](https://github.com/'"$GH_REPO"'#install). This build is ad-hoc signed and not notarized, so macOS asks for confirmation on first launch.'
            echo
            echo '## SHA-256 checksums'
            echo
            echo '```text'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } > notes.md

          case $TAG in
              *-*) flags=--prerelease ;;
              *) flags= ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag $flags
